name: Build

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform breaking should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis/*.exe
            config: ""
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg/*.dmg
            config: --config src-tauri/tauri.macos.conf.json
          # Cross-compiled from the arm64 runner: the Intel macos-13 runner is
          # on its way out, and the macOS SDK builds both archs either way.
          - platform: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg/*.dmg
            config: --config src-tauri/tauri.macos.conf.json
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          for pair in "tauri.conf.json:$CONF_VERSION" "package.json:$PKG_VERSION" "Cargo.toml:$CARGO_VERSION"; do
            name="${pair%%:*}"
            version="${pair##*:}"
            if [ "$version" != "$TAG_VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $name version ($version)"
              exit 1
            fi
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests
        run: npm test

      # Deliberately not --target: a cross-compiled x86_64 test binary cannot
      # run on the arm64 runner, and the logic under test is arch-independent.
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build app
        run: npm run build -- --target ${{ matrix.target }} ${{ matrix.config }}

      - name: Check the app is signed
        if: runner.os == 'macOS'
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/downer.app"
          codesign --display --verbose=2 "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: downer-${{ github.ref_name }}-${{ matrix.platform }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}
          if-no-files-found: error
