name: Build

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          for pair in "tauri.conf.json:$CONF_VERSION" "package.json:$PKG_VERSION" "Cargo.toml:$CARGO_VERSION"; do
            name="${pair%%:*}"
            version="${pair##*:}"
            if [ "$version" != "$TAG_VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $name version ($version)"
              exit 1
            fi
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build app
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: downer-${{ github.ref_name }}-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
