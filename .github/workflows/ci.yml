name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis/*.exe
            config: ""
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg/*.dmg
            config: --config src-tauri/tauri.macos.conf.json
          - platform: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg/*.dmg
            config: --config src-tauri/tauri.macos.conf.json
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build app
        run: npm run build -- --target ${{ matrix.target }} ${{ matrix.config }}

      - name: Check the app is signed
        if: runner.os == 'macOS'
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/downer.app"
          codesign --display --verbose=2 "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: downer-dev-${{ github.sha }}-${{ matrix.platform }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}
          if-no-files-found: error
